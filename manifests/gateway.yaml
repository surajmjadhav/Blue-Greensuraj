apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: demo-app
spec:
  gatewayClassName: traefik  # Agar Traefik use kar rahe ho toh traefik, warna apna gateway class name daalna
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All